<h1 class="mb-4">Pluem Page</h1>

<div class="row g-3">
  @for (item of data; track item.id) {
    <div class="col-12 col-md-4">
      <div class="card h-100">
        <div class="card-body">
          <app-pluem-page [id]="item.id" [name]="item.name" [description]="item.description" />
        </div>
      </div>
    </div>
  }
</div>
