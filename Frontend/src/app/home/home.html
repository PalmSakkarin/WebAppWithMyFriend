<div class="container-fluid home-container">

  <div class="hero-section">
    <h1 class="hero-title">Welcome to Home 👋</h1>
    <p class="hero-subtitle">Select a page to explore</p>
  </div>

  <div class="cards-grid">
    
    <!-- Palm Page Card -->
    <div class="card-wrapper" (click)="navigateToPalmPage()">
      <div class="card card-primary">
 <div class="card-icon">🌴</div>
 <h3 class="card-title">Palm Page</h3>
 <p class="card-description">Explore the Palm Page features and content</p>
        <div class="card-footer">
          <span class="card-link">Click to visit →</span>
        </div>
      </div>
    </div>

    <!-- Pluem Page Card -->
    <div class="card-wrapper" (click)="navigateToPluemPage()">
      <div class="card card-secondary">
        <div class="card-icon">🌸</div>
        <h3 class="card-title">Pluem Page</h3>
        <p class="card-description">Discover the Pluem Page experiences</p>
 <div class="card-footer">
          <span class="card-link">Click to visit →</span>
 </div>
      </div>
    </div>

    <!-- Dashboard Card -->
    <div class="card-wrapper" (click)="navigateToDashboard()">
      <div class="card card-accent">
 <div class="card-icon">📊</div>
 <h3 class="card-title">Dashboard</h3>
 <p class="card-description">View analytics and statistics</p>
        <div class="card-footer">
   <span class="card-link">Click to visit →</span>
        </div>
      </div>
    </div>

  </div>

</div>
